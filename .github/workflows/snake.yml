name: Generate Snake

on:
  # Schedule updates every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # Allows you to manually run the job at any time
  workflow_dispatch:
  # Also run on every push to the main branch
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Generates a snake game from a github user contributions graph
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: IamIremIdil
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%23ff69b4&color_dots=%23ebedf0,%23ffb6c1,%23ff69b4,%23ff1493,%23c71585
      # Push the content of <build_dir> to a branch
      # The content will be available at https://githubusercontent.com<username>/<repo>/<target_branch>/<file>
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
